name: Bug report
description: Report a reproducible problem using privacy-safe, synthetic details.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or paste real databases, exports, message text, contact names,
        handles, phone numbers, screenshots, attachments, backup passwords, or
        machine-specific evidence paths. Redact the error and use synthetic examples.
  - type: dropdown
    id: source
    attributes:
      label: Source category
      options:
        - macOS Messages database
        - macOS CallHistoryDB cache
        - Extracted iPhone CallHistory database
        - Synthetic fixture only
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: macOS, iOS source version if known, Python, Node.js, and Git commit or release.
      placeholder: "macOS version; Python version; Node.js version; commit"
    validations:
      required: true
  - type: textarea
    id: preflight
    attributes:
      label: Privacy-safe preflight output
      description: Paste check_compatibility.py output only after confirming it contains no sensitive path.
      render: text
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
      description: Use synthetic values and remove private paths or identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all private evidence, identifiers, credentials, and machine-specific paths.
          required: true
